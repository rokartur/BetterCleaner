# Sign each published GitHub Release with a BetterUpdater manifest.
# Decoupled from the build: signs whatever .dmg/.zip assets are attached.
#
# Setup: add repo secret BETTERUPDATER_PRIVATE_KEY (base64 Ed25519 private key
# whose PUBLIC half is pinned in AppDelegate's BetterUpdater.bootstrap).

name: sign-release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  sign:
    runs-on: macos-15
    env:
      OWNER: rokartur
      REPO: BetterCleaner
      BUNDLE_ID: com.rokartur.BetterCleaner
      TEAM_ID: N529W98U62
      PINNED_PUBLIC_KEY: EAVcucb8UX0CXlHR1UdPhVEuKdN/erxBigQWX91LbVc=
    steps:
      - name: Select Xcode 16 (Swift 6 toolchain)
        # BetterUpdater's Package.swift declares swift-tools-version 6.0;
        # pin the toolchain so `swift build` doesn't fall back to 5.10.
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" \
            --pattern '*.dmg' --pattern '*.zip' --dir dist || true
          ls -la dist

      - name: Build betterupdater CLI
        run: |
          git clone --depth 1 https://github.com/rokartur/BetterUpdater.git /tmp/betterupdater
          (cd /tmp/betterupdater && swift build -c release --product betterupdater)
          echo "BU=/tmp/betterupdater/.build/release/betterupdater" >> "$GITHUB_ENV"

      - name: Require notarized assets (fail-closed)
        # The in-app updater (manifestRequired: true) installs whatever the signed
        # manifest covers. Refuse to sign a manifest over an un-notarized asset so
        # the updater can never ship a build Gatekeeper would later block. Each
        # released .dmg is stapled; the .zip's embedded .app is stapled too.
        run: |
          fail=0
          shopt -s nullglob
          for dmg in dist/*.dmg; do
            echo "▸ stapler validate $dmg"
            xcrun stapler validate "$dmg" || { echo "❌ not notarized/stapled: $dmg"; fail=1; }
          done
          for zip in dist/*.zip; do
            tmp="$(mktemp -d)"
            ditto -x -k "$zip" "$tmp"
            app="$(find "$tmp" -maxdepth 1 -name '*.app' | head -1)"
            if [ -z "$app" ]; then echo "❌ no .app in $zip"; fail=1; continue; fi
            echo "▸ stapler validate $app (from $zip)"
            xcrun stapler validate "$app" || { echo "❌ not notarized/stapled: $zip"; fail=1; }
            echo "▸ spctl assess $app"
            spctl --assess --type execute --verbose "$app" || { echo "❌ Gatekeeper rejects: $zip"; fail=1; }
          done
          [ "$fail" -eq 0 ] || { echo "Refusing to sign a manifest over un-notarized assets."; exit 1; }

      - name: Sign manifest
        env:
          BETTERUPDATER_PRIVATE_KEY: ${{ secrets.BETTERUPDATER_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSETS=$(printf -- '--asset %s ' dist/*.dmg dist/*.zip 2>/dev/null)
          [ -z "$ASSETS" ] && { echo "No .dmg/.zip assets on release"; exit 1; }
          "$BU" sign \
            --owner "$OWNER" --repo "$REPO" \
            --bundle-id "$BUNDLE_ID" --team-id "$TEAM_ID" \
            --version "$VERSION" \
            $ASSETS \
            --out dist/betterupdater-manifest.json

      - name: Verify before upload (fail-closed guard)
        run: |
          ASSETS=$(printf -- '--asset %s ' dist/*.dmg dist/*.zip 2>/dev/null)
          "$BU" verify \
            --public-key "$PINNED_PUBLIC_KEY" \
            --manifest dist/betterupdater-manifest.json \
            $ASSETS

      - name: Upload manifest + signature to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            dist/betterupdater-manifest.json \
            dist/betterupdater-manifest.json.sig \
            --repo "${{ github.repository }}" --clobber
